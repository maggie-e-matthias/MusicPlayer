<!doctype html>
<html lang="en">
  <head>
    <title>Music Player</title>
    <!--Style-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App Content -->
    <div class="app" style="-webkit-app-region: drag">
      <!-- Title Bar -->
      <div class="title-bar">
        <!-- Some Title (might end up removing it) -->
        <p id="some-title">Make a wish!</p>

        <!-- Title Bar Buttons -->
        <div class="title-bar-btns">
          <!-- Minimize button-->
          <button class="title-bar-btn" id="minimize">
            <!-- Insert img asset -->
            ➖
          </button>
          <!-- Close button -->
          <button class="title-bar-btn" id="close">
            <!-- Insert img asset -->
            ✖️​
          </button>
        </div>
      </div>

      <!-- Sub-Title Bar (for tab control buttons) -->
      <div class="sub-title-bar">
        <!-- Menu button -->
        <button class="sub-title-bar-btn" id="menu">
          <!-- Insert img asset -->
          menu
        </button>
        <!-- Now Playing button -->
        <button class="sub-title-bar-btn" id="now-playing">
          <!-- Insert img asset -->
          now playing
        </button>
      </div>

      <!-- Now Playing Tab (Default) -->
      <div class="tab" id="now-playing-tab">
        <!-- Playing Track Zone -->
        <div class="track-zone">
          <!-- Insert img's for tracks -->

          <div class="place-holder" id="track-zone-place-holder">
            No track thumbnail available
          </div>

          <!-- Track Info -->
          <div class="track-info">
            <h2 id="track-name">Track Name</h2>
            <h3 id="track-artist">Artist</h3>
          </div>
        </div>

        <!-- Seek Bar -->
        <div class="seek-bar">
          <button id="seek-cursor">​</button>
          <div class="seek-bar-fill" id="seek-fill"></div>
        </div>

        <!-- Seek Timer -->
        <div class="timer">
          <span id="current-time">00:00</span>
          <span id="total-time">00:00</span>
        </div>

        <!-- Control Buttons -->
        <div class="control-btns">
          <!-- Previous Button -->
          <button class="control-btn" id="previous">
            <!-- Insert img asset -->
            ⏮️
            <!--temporary-->
          </button>
          <!-- Play/Pause Button -->
          <button class="control-btn" id="play">
            <!-- Insert img asset -->
            ▶️
            <!--temporary-->
          </button>
          <!-- Next Button -->
          <button class="control-btn" id="next">
            <!-- Insert img asset -->
            ⏭️​
            <!--temporary-->
          </button>
          <!-- Loop control Button -->
          <button class="control-btn" id="loop-control">
            <!-- Insert img asset -->
            ​🔁​
            <!--temporary-->
          </button>
        </div>
      </div>

      <!-- Menu Tab -->
      <div class="tab" id="menu-tab">
        <!-- Sub-tabs -->
        <div class="sub-tabs-menu">
          <!-- Lists & Playlists -->
          <button id="lists">Lists</button>

          <!-- All songs/tracks/main tab -->
          <button id="tracks">Tracks</button>

          <!-- Artists -->
          <button id="artists">Artists</button>

          <!-- Albums -->
          <button id="albums">Albums</button>
        </div>

        <div class="sub-tab" id="tracks-tab">
            <div class="list-container" id="track-list"></div>
        </div>
      </div>
    </div>

    <!--Script-->
    <script src="script.js"></script>
  </body>
</html>
