<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Music Player</title>
        <!--Style-->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- App Content -->
        <div class="app" style="-webkit-app-region: drag;">
            
            <!-- Title Bar -->
            <div class="title-bar">
                <!-- Some Title (might end up removing it) -->
                <h1 id="some-title">Make a wish!</h1>

                <!-- Title Bar Buttons -->
                <div class="title-bar-btns">
                    <!-- Menu button -->
                    <button class="title-bar-btn" id="menu">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Now Playing button -->
                    <button class="title-bar-btn" id="now-playing">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Minimize button-->
                    <button class="title-bar-btn" id="minimize">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Close button -->
                    <button class="title-bar-btn" id="close">
                        <!-- Insert img asset -->
                    </button>


                </div>
            </div>

            <!-- Now Playing Tab (Default) -->
            <div class="tab" id="now-playing">
                <!-- Playing Track Zone -->
                <div class="track-zone">
                    <!-- Insert img's for tracks -->
                    
                    <!-- Track Info -->
                    <div class="track-info">
                        <h2 id="track-name">Track Name</h2>
                        <h3 id="track-artist">Artist</h3>
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="control-btns">
                    <!-- Previous Button -->
                    <button class="control-btn" id="previous">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Play/Pause Button -->
                    <button class="control-btn" id="play">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Next Button -->
                    <button class="control-btn" id="next">
                        <!-- Insert img asset -->
                    </button>
                </div>
            </div>

            <!-- Menu Tab -->
            <div class="tab" id="menu">
                <p id="place-holder">Nothing to see here, yet.</p>
            </div>
        </div>

        <!--Script-->
        <script src="script.js"></script>
    </body>
</html>
