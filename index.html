<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Music Player</title>
        <!--Style-->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- App Content -->
        <div class="app" style="-webkit-app-region: drag;">
            
            <!-- Title Bar -->
            <div class="title-bar">
                <!-- Some Title (might end up removing it) -->
                <p id="some-title">Make a wish!</p>

                <!-- Title Bar Buttons -->
                <div class="title-bar-btns">
                    <!-- Minimize button-->
                    <button class="title-bar-btn" id="minimize">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Close button -->
                    <button class="title-bar-btn" id="close">
                        <!-- Insert img asset -->
                    </button>
                </div>
            </div>

            <!-- Sub-Title Bar (for tab control buttons) -->
            <div class="sub-title-bar">
                    <!-- Menu button -->
                    <button class="sub-title-bar-btn" id="menu">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Now Playing button -->
                    <button class="sub-title-bar-btn" id="now-playing">
                        <!-- Insert img asset -->
                    </button>
            </div>

            <!-- Now Playing Tab (Default) -->
            <div class="tab" id="now-playing-tab">
                <!-- Playing Track Zone -->
                <div class="track-zone">
                    <!-- Insert img's for tracks -->

                    <!-- Track Info -->
                    <div class="track-info">
                        <h2 id="track-name">Track Name</h2>
                        <h3 id="track-artist">Artist</h3>
                    </div>
                </div>

                <!-- Seek Bar -->
                <div class="seek-bar">
                    <div class="seek-bar-part" id="part-1">-</div>
                    <div class="seek-bar-part" id="part-2">-</div>
                    <div class="seek-bar-part" id="part-3">-</div>
                    <div class="seek-bar-part" id="part-4">-</div>
                    <div class="seek-bar-part" id="part-5">-</div>
                    <div class="seek-bar-part" id="part-6">-</div>
                    <div class="seek-bar-part" id="part-7">-</div>
                    <div class="seek-bar-part" id="part-8">-</div>
                    <div class="seek-bar-part" id="part-9">-</div>
                    <div class="seek-bar-part" id="part-10">-</div>
                    <div class="seek-bar-part" id="part-11">-</div>
                    <div class="seek-bar-part" id="part-12">-</div>
                    <div class="seek-bar-part" id="part-13">-</div>
                    <div class="seek-bar-part" id="part-14">-</div>
                    <div class="seek-bar-part" id="part-15">-</div>
                    <div class="seek-bar-part" id="part-16">-</div>
                    <div class="seek-bar-part" id="part-17">-</div>
                    <div class="seek-bar-part" id="part-18">-</div>
                    <div class="seek-bar-part" id="part-19">-</div>
                    <div class="seek-bar-part" id="part-20">-</div>
                    <span class="timer" id="current-time">00:00</span>
                    <span class="timer" id="total-time">00:00</span>
                </div>

                <!-- Control Buttons -->
                <div class="control-btns">
                    <!-- Previous Button -->
                    <button class="control-btn" id="previous">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Play/Pause Button -->
                    <button class="control-btn" id="play">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Next Button -->
                    <button class="control-btn" id="next">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Loop control Button -->
                    <button class="control-btn" id="loop-control">
                        <!-- Insert img asset -->
                    </button>
                </div>
            </div>

            <!-- Menu Tab -->
            <div class="tab" id="menu-tab">
                <p id="place-holder">Nothing to see here, yet.</p>
            </div>
        </div>

        <!--Script-->
        <script src="script.js"></script>
    </body>
</html>
