<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Music Player</title>

    </head>
    <body>
        <!--Style-->
        <link rel="stylesheet" href="style.css">

        <!-- App Content -->
        <div class="app" style="-webkit-app-region: drag;">
            
            <!-- Title Bar -->
            <div class="title-bar">
                <!-- Some Title (might end up removing it) -->
                <h1 id="some-title">Make a wish!</h1>

                <!-- Title Bar Buttons -->
                <div class="title-bar-btns">

                    <!-- Go Back button -->
                    <button class="title-bar-btn" id="go-back">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Go Forward button -->
                    <button class="title-bar-btn" id="go-forward">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Minimize button-->
                    <button class="title-bar-btn" id="minimize">
                        <!-- Insert img asset -->
                    </button>
                    <!-- Close button -->
                    <button class="title-bar-btn" id="close">
                        <!-- Insert img asset -->
                    </button>


                </div>
            </div>

            <!-- Playing Track Zone -->
            <div class="track-zone">
                <!-- Insert img's for tracks -->
                
                <!-- Track Info -->
                <div class="track-info">
                    <h2 id="track-name">Track Name</h2>
                    <h3 id="track-artist">Artist</h3>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-btns">
                <!-- Previous Button -->
                <button class="control-btn" id="previous">
                    <!-- Insert img asset -->
                </button>
                <!-- Play/Pause Button -->
                <button class="control-btn" id="play">
                    <!-- Insert img asset -->
                </button>
                <!-- Next Button -->
                <button class="control-btn" id="next">
                    <!-- Insert img asset -->
                </button>
            </div>
        </div>

        <!--Script-->
        <script src="script.js"></script>
    </body>
</html>
